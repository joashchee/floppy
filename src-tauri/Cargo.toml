[package]
name = "floppy"
version = "0.6.0"
description = "Floppy — run the old apps your files need, in their own OS"
authors = ["ansiapps"]
license = "GPL-2.0-or-later"
edition = "2021"

[lib]
# The `_lib` suffix keeps the lib name distinct from the bin name
# (https://github.com/rust-lang/cargo/issues/8519).
name = "floppy_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-log = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
log = "0.4"
walkdir = "2"
# Importing a zipped DOS program — read-only, deflate is all old DOS zips use.
zip = { version = "8.6.0", default-features = false, features = ["deflate-flate2"] }
# zip's `deflate-flate2` picks no backend. On macOS a Tauri dependency happens
# to enable flate2's pure-Rust one; say so here so other platforms build too.
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }
# Reading `diskutil -plist` output to spot old media macOS can't mount.
plist = "1"
# SHA-256 of files a files disc brought that Floppy couldn't use, for the
# missing-files list's skip lines (cd.rs).
sha2 = "0.10"
# Checking that a Floppy AI knowledge pack is signed by Floppy's
# maintainers (learned.rs, ai.rs). Verification only in the app; signing is
# examples/ai-pack-key.rs. BSD-3-Clause, and its dependencies MIT/Apache-2.0.
ed25519-dalek = { version = "2", default-features = false, features = ["std"] }

# Resource forks and Finder info (getxattr/setxattr) for classic Mac imports.
[target.'cfg(target_os = "macos")'.dependencies]
libc = "0.2"

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
