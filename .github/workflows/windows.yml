# Builds Floppy for Windows: the NSIS installer (.exe) and the MSI, after
# the unit tests and the frontend's type check, uploaded as the run's
# artifact and published to a release (scripts/publish-release.sh), which
# ansiapps.com links to. By hand (Actions -> Windows build -> Run
# workflow), on a version tag, and on a change to this file or the
# Windows build scripts.
# Public beta: DOSBox Staging and FS-UAE are bundled, Basilisk II isn't
# yet (docs/platform-parity.md). Unsigned: SmartScreen warns until the
# installers are code-signed.
# Standard GitHub-hosted runners only, in this public repository, so it
# stays free and unlimited (CLAUDE.md, "GitHub Actions only where it's
# free and unlimited").
name: Windows build

on:
  workflow_dispatch:
  push:
    # Path filters don't apply to tags: every v* tag builds.
    branches: ["**"]
    tags: ["v*"]
    paths:
      - .github/workflows/windows.yml
      - scripts/build-windows.ps1
      - scripts/fetch-windows-emulators.ps1
  pull_request:
    paths:
      - .github/workflows/windows.yml
      - scripts/build-windows.ps1
      - scripts/fetch-windows-emulators.ps1

permissions:
  contents: read

concurrency:
  group: windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 120
    env:
      # Python on Windows reads and writes cp1252 unless told otherwise.
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - run: npm ci

      - name: Fetch Windows emulators
        shell: pwsh
        run: ./scripts/fetch-windows-emulators.ps1

      - run: cargo test --manifest-path src-tauri/Cargo.toml
      - run: npx tsc --noEmit

      # Remaps the runner's paths, writes the licenses this build links,
      # builds the NSIS installer and the MSI (tauri.conf.json's "all" on
      # Windows), and checks no profile path is left in floppy.exe.
      - name: Build Windows installers
        shell: pwsh
        run: ./scripts/build-windows.ps1

      - uses: actions/upload-artifact@v7
        with:
          name: floppy-windows
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi
          if-no-files-found: error

  # Every successful build on main or a v* tag goes to a release: the
  # version's own, or the dev prerelease between versions
  # (scripts/publish-release.sh says which). Not pull requests, nor other
  # branches: they'd replace main's files.
  publish:
    needs: build
    if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: publish-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          name: floppy-windows
          path: dist

      - name: Publish to a release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          shopt -s globstar
          scripts/publish-release.sh dist/**/*.exe dist/**/*.msi
